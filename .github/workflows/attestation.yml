
name: Build and attest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test.txt
        run: |
          echo "Hello, $GITHUB_ACTOR!" > test.txt

      - name: Generate SLSA provenance
        uses: actions/attest@v4
        with:
          subject-path: test.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-file
          path: test.txt
